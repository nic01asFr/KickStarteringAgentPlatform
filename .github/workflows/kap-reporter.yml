name: BigStarter Reporter

on:
  push:
    branches: [main]
    paths-ignore: ['.kap/updates/**']
  pull_request:
    types: [closed]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate update
        run: |
          cat > /tmp/generate-update.mjs << 'EOF'
          import { execSync } from 'node:child_process'
          import { writeFileSync, mkdirSync } from 'node:fs'

          const event = process.env.GITHUB_EVENT_NAME || 'workflow_dispatch'
          const ref = process.env.GITHUB_REF_NAME || 'main'
          const repo = process.env.GITHUB_REPOSITORY || 'unknown'
          const sha = (process.env.GITHUB_SHA || '').slice(0, 7)

          let commits = ''
          try {
            commits = execSync('git log -5 --oneline', { encoding: 'utf8' }).trim()
          } catch {
            commits = '(no git log)'
          }

          // Template-only in CI — no Anthropic dependency.
          // Editorial LLM updates stay in the local MCP plugin (sampling).
          const lines = [
            `Activity on ${repo} (${event}, ${ref}${sha ? `, ${sha}` : ''}).`,
          ]
          if (commits && commits !== '(no git log)') {
            const first = commits.split('\n')[0]
            if (first) lines.push(`Latest: ${first}.`)
          }
          const update = lines.join(' ')

          const date = new Date().toISOString().slice(0, 10)
          const slug = update
            .slice(0, 48)
            .toLowerCase()
            .replace(/[^a-z0-9]+/g, '-')
            .replace(/^-|-$/g, '') || 'update'
          const filename = `.kap/updates/${date}-${slug}.md`
          const content = [
            '---',
            `date: "${new Date().toISOString()}"`,
            `event_type: "${event}"`,
            '---',
            '',
            update,
            '',
          ].join('\n')

          mkdirSync('.kap/updates', { recursive: true })
          writeFileSync(filename, content)
          console.log(`Written: ${filename}`)
          console.log(update)
          EOF
          node /tmp/generate-update.mjs
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}

      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .kap/updates/
          git diff --cached --quiet || git commit -m "chore: add project update [skip ci]"
          git push
