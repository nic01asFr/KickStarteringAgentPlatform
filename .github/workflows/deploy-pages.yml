name: Deploy BigStarter Platform

on:
  push:
    branches: [main]
    paths:
      - 'apps/platform/**'
      - '.kap/**'
      - 'package-lock.json'
      - 'package.json'
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Prefer ci when lock is in sync; fall back so a rename does not block Pages
      - name: Install dependencies
        run: |
          if npm ci; then
            echo "npm ci ok"
          else
            echo "npm ci failed — regenerating lock via npm install"
            npm install
          fi

      - run: npm run build --workspace=apps/platform
        env:
          NEXT_PUBLIC_GITHUB_TOKEN: ${{ secrets.BIGSTARTER_GITHUB_TOKEN }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/platform/out

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
