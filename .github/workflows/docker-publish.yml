name: Build and Push Docker Images

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'charts/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: kap-mcp
            dockerfile: packages/mcp-server/Dockerfile
            image: ghcr.io/nic01asfr/kap-mcp
            context: .
            registry: ghcr
          # Legacy Docker Hub images (optional — skip if secrets missing)
          - app: platform
            dockerfile: apps/platform/Dockerfile
            image: nic01asfr/bigstarter-platform
            context: .
            registry: dockerhub
          - app: api
            dockerfile: apps/api/Dockerfile
            image: nic01asfr/bigstarter-api
            context: .
            registry: dockerhub
          - app: worker
            dockerfile: apps/worker/Dockerfile
            image: nic01asfr/bigstarter-worker
            context: .
            registry: dockerhub
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: matrix.registry == 'dockerhub'
        continue-on-error: true
        id: dockerhub_login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GHCR
        if: matrix.registry == 'ghcr'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=0.4.0,enable={{is_default_branch}}

      - name: Build and push ${{ matrix.app }}
        if: matrix.registry == 'ghcr' || steps.dockerhub_login.outcome == 'success'
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Skip Docker Hub (no credentials)
        if: matrix.registry == 'dockerhub' && steps.dockerhub_login.outcome != 'success'
        run: echo "Skipping ${{ matrix.app }} — set DOCKER_USERNAME / DOCKER_PASSWORD secrets to enable."
