apiVersion: v1
kind: Service
metadata:
  name: {{ include "library-chart.fullname" . }}
  labels:
    {{- include "library-chart.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ include "kap-platform.caddyPort" . }}
      targetPort: {{ include "kap-platform.caddyPort" . }}
      protocol: TCP
      name: http
  selector:
    {{- include "library-chart.selectorLabels" . | nindent 4 }}