apiVersion: v1
kind: Secret
metadata:
  name: {{ include "library-chart.fullname" . }}
  labels:
    {{- include "library-chart.labels" . | nindent 4 }}
  {{- if .Values.persistence.keepOnUninstall }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
type: Opaque
stringData:
  BEARER_TOKEN: {{ include "kap-mcp.bearerToken" . | quote }}
  GITHUB_TOKEN: {{ .Values.github.token | default "" | quote }}
  GITHUB_OWNER: {{ .Values.github.owner | default "" | quote }}
  GITHUB_REPO: {{ .Values.github.repo | default "" | quote }}
